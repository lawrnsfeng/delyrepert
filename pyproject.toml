[project]
name = "daily-report"
dynamic = ["version"]
description = "Collect Jira progress and compose the daily standup"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "pydantic>=2.14.2",
    "structlog>=26.1.0",
    "typer>=0.27.3",
]

[project.scripts]
daily-report = "daily_report.cli:app"

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"
default-version = "0.0.0+unknown"

[tool.hatch.version.format]
distance = "{next_version}.dev{distance}+{vcs}{rev}"
dirty = "{version}+dirty"
distance-dirty = "{next_version}.dev{distance}+{vcs}{rev}.dirty"

[tool.hatch.build]
artifacts = ["daily_report/_version.py"]

[tool.hatch.build.targets.wheel]
packages = ["daily_report"]

[tool.hatch.build.targets.sdist]
only-include = ["daily_report"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["ALL"]
exclude = ["*mock*.py"]
ignore = [
    "CPY001",  # missing-copyright-notice (no per-file licence headers here)
    "D100",  # undocumented-public-module
    "D104",  # undocumented-public-package
    "D105",  # undocumented-magic-method
    "D203",  # one-blank-line-before-class
    "D213",  # multi-line-summary-second-line
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "S101",  # assert
    "ARG001",  # unused-function-argument (fixtures for setup/cleanup)
    "PLR2004",  # magic-value-comparison (test assertions)
    "EM101",  # raw-string-in-exception
    "SLF001",  # private-member-access
    "TRY003",  # raise-vanilla-args
]
# Typer controllers take one parameter per CLI option.
"daily_report/*/commands.py" = [
    "PLR0913",  # too-many-arguments
]

[tool.mypy]
python_version = "3.13"
files = ["daily_report", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true
commit_message = "chore(release): v{version}\n\n[skip ci]"
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.commit_parser_options]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.branches.main]
match = "master"
prerelease = false

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
]
