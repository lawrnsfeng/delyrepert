---
# Slack app manifest for the daily-report listener.
# Use it at api.slack.com/apps > Create new app > From manifest.
# Socket Mode needs an app-level token with connections:write: SLACK_APP_TOKEN.
display_information:
  name: daily-report
  description: Approve and control the daily standup from Slack
features:
  bot_user:
    display_name: daily-report
    always_online: false
  slash_commands:
    - command: /standup
      description: Run, preview, check, pause or add a note to the standup
      usage_hint: run|preview|status|pause [YYYY-MM-DD]|resume|note <text>|help
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
