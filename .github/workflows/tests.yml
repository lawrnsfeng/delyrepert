---
name: Tests
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full:
    name: full suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: |-
          uv run --no-sync python -m pytest --cov=daily_report --cov-branch \
            --cov-fail-under=100 tests
