# daily-report config. Copy it anywhere and pass it with --config or DAILY_REPORT_CONFIG.
# Every value below is a placeholder.

# Where snapshots, notes and drafts live. --state-dir and DAILY_REPORT_STATE_DIR override it.
state_dir = "/path/to/daily-report-state"

# IANA zone for "today", snapshot names and working days. Omit it to use the system zone.
timezone = "Europe/London"

# Name shown before the standup headline. Omit it to show the headline alone.
display_name = "Your Name"

# A draft cannot be approved after this local time on the day it was made.
approval_cutoff = "12:00"
# 0600 env file with SLACK_BOT_TOKEN, SLACK_APP_TOKEN, SLACK_USER_TOKEN and JIRA_API_TOKEN.
secrets_file = "/path/to/daily-report-secrets.env"
# Your Slack user ID; `run` and `serve` refuse to start without it, and only you may use /standup.
owner_slack_user_id = "U0123456789"

# service install: systemd OnCalendar= expression for the scheduled draft (local time).
schedule = "Mon..Fri *-*-* 09:00:00"

[jira]
base_url = "https://your-site.atlassian.net"
email = "you@example.com"
# Statuses that mark a ticket blocked (case-insensitive).
blocked_statuses = ["Blocked"]
# Field whose value flagged_value also marks a ticket blocked; "" disables the check.
flagged_field = "Flagged"
flagged_value = "Impediment"

[render]
# One of bluf, ytb, table, markdown, compact, cards, richlist. Leave it unset to see all
# seven styles in every preview until you pick one.
# style = "bluf"
# Slack team ID: Builder links open in your workspace (the team-less link can lose the payload).
# builder_team = "T0123456789"

[emoji]
# Animated custom emoji (name without colons) shown on blocker lines when Slack lists it.
blocked_animated = "your-animated-emoji"

# Programs that print context JSON on stdout; add one table per program.
# [[context.commands]]
# name = "my-skill"
# argv = ["my-skill", "--json"]

# Where `post` puts the standup. See docs/slack.md for the token scopes and the channel ID.
[slack]
channel = "C0123456789"
# The standup parent message: the latest one in the window matching every rule you set.
# Rules: user_id, bot_id, username, text_contains, text_regex (see docs/slack.md).
parent_match = { user_id = "U0123456789", text_contains = "Daily standup" }
# A bot parent whose words live in attachments or blocks:
# parent_match = { bot_id = "B0123456789", text_regex = "^Daily standup" }
# Days before today the parent may be from (0-7; 0 = since local midnight).
# lookback_days = 1

# Another thread, picked with --thread weekly; channel defaults to slack.channel.
# [slack.threads.weekly]
# channel = "C0987654321"
# parent_match = { username = "Weekly bot", text_contains = "Weekly sync" }
# lookback_days = 7

[post]
# thread (default), thread_broadcast (also show in the channel) or channel (top-level).
target = "thread"

# `daily-report demo` posts only into this test workspace; omit the table to preview files only.
# [demo]
# slack_team_id = "T0123456789"
# channel = "C0123456789"
# parent_text = "(demo)"
# state_dir = "/path/to/demo-state"

# Optional: `compose --cook` runs this program to polish the wording. It gets draft JSON on
# stdin and prints {"headline": ..., "summaries": {"<id>": "<text>"}}.
# [cook]
# command = ["your-ai-cli", "--json"]
# timeout_s = 60
